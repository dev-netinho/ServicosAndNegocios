spring.application.name=deefy-group2-services
server.port=8080

spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# Credenciais: application-local.properties (gitignored) ou variáveis SPRING_DATASOURCE_*.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs-ui
